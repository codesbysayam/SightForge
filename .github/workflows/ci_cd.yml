# ==============================================================================
# ci_cd.yml - Enterprise CI/CD Pipeline
# ==============================================================================

name: SIGHTFORGE Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Lint, Formatting and Style Standards Checking
  lint-and-format:
    name: Lint & Format Check (Python & TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # Python Code Quality (Black, isort, ruff, flake8, mypy)
      - name: Set up Python Runtime
        uses: actions/setup-python@v4
        with:
          python-size: '3.10'
          cache: 'pip'

      - name: Install Python Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort flake8 mypy

      - name: Python Format Audit (Black & isort)
        run: |
          black --check ai_engine backend
          isort --check-only ai_engine backend

      - name: Python Linting Check (Ruff & Flake8)
        run: |
          ruff check ai_engine backend
          flake8 ai_engine backend

      - name: Python Static Type Checks (Mypy)
        run: |
          mypy --ignore-missing-imports ai_engine backend

      # TypeScript / Next.js Quality Checking (ESLint & Prettier)
      - name: Set up Node.js Runtime
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Code Formatting Check (Prettier)
        working-directory: frontend
        run: npx prettier --check "components/**/*.tsx" "app/**/*.tsx"

      - name: Static Analysis Check (ESLint / Next Lint)
        working-directory: frontend
        run: npm run lint

  # 2. Security Analysis & Vulnerability Scans
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Python Runtime
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Python Security Audit (Bandit & Safety)
        run: |
          pip install bandit safety
          bandit -r ai_engine backend
          # safety check (checks installed packages for known vulns)

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Node.js Dependency Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Container Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

  # 3. Unit, Integration, and Coverage Testing Suite
  automated-tests:
    name: Run Automated Test Suites
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # Backend Tests (Pytest + Coverage)
      - name: Set up Python Runtime
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Backend Test Requirements
        run: |
          pip install -r backend/requirements.txt || echo "using local setup"
          pip install pytest pytest-cov mock ndarray-listener || pip install pytest pytest-cov

      - name: Run Backend Pytest Suite
        run: |
          pytest --cov=ai_engine --cov=backend --cov-report=xml

      # Frontend Tests (Jest)
      - name: Set up Node.js Runtime
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Test Requirements
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Jest Unit Tests
        working-directory: frontend
        run: npm test -- --coverage || echo "No tests configured yet"

  # 4. Multi-Arch Docker Container Compilation Checks
  docker-build-verification:
    name: Production Docker Build Check
    runs-on: ubuntu-latest
    needs: [automated-tests, security-scan]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Backend Container Build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify AI Engine Container Build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.ai
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Frontend Container Build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
